plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.iconchanger'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.iconchanger"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    def keystoreProps = new Properties()
    def kpFile = rootProject.file("keystore.properties")
    if (kpFile.exists()) {
        keystoreProps.load(new FileInputStream(kpFile))
    }

    signingConfigs {
        release {
            storeFile file("../iconchange.jks")
            storePassword keystoreProps.getProperty("storePassword", System.getenv("STORE_PASSWORD") ?: "")
            keyAlias keystoreProps.getProperty("keyAlias", System.getenv("KEY_ALIAS") ?: "iconchange")
            keyPassword keystoreProps.getProperty("keyPassword", System.getenv("KEY_PASSWORD") ?: "")
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
